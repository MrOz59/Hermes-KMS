# Installed by hermes-kms-kwin-bridge (experimental). Lets KWin 6.8 render
# Hermes-KMS virtual outputs on the GPU and scan them out by PRIME import,
# instead of copying every frame into a system-memory dumb buffer.
# See docs/kwin-render-bridge.md in the Hermes-KMS repository.
#
# kwin_wayland carries cap_sys_nice, so glibc runs it in secure mode and
# preloads only a bare library name from the trusted system directory whose
# file has the set-user-ID bit. That bit is a trust marker; the library is
# never executed with it. glibc then removes LD_PRELOAD from kwin_wayland's
# environment (the bridge does the same where glibc does not), so Xwayland
# and applications started by KWin never inherit it. kwin_wayland_wrapper
# also loads the library, where it stays a pure pass-through.
#
# To turn the bridge off without uninstalling it:
#   systemctl --user edit plasma-kwin_wayland.service
#   [Service]
#   Environment=HERMES_KMS_KWIN_BRIDGE=off
# then log out and back in.
[Service]
Environment=LD_PRELOAD=libhermes-kms-kwin-bridge.so
Environment=HERMES_KMS_KWIN_BRIDGE_ACTIVE=1
