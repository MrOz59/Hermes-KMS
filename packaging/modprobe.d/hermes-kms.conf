# Default Hermes-KMS module options for compositor-driven streaming.
#
# Leave connectors disconnected until Hermes assigns one to a stream. The
# packaged pool keeps one card on seat0 for the existing host-desktop mode and
# pre-creates four inert private cards for isolated sessions. The private cards
# allocate scanout memory only after Hermes assigns them to a client.
#
# Advanced users can override session_devices from 0 through 8 in /etc. A value
# of 0 restores the legacy single-card default.
options hermes_kms initial_enabled=0 outputs=1 session_devices=4
